<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>تحدي الأرقام — وضع فردي</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
html{background:#070B1F;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#070B1F;--bg2:#0C1130;--card:rgba(255,255,255,.04);--card2:rgba(255,255,255,.07);
  --cyan:#00E5FF;--gold:#FFD046;--green:#00E676;--red:#FF3D5A;--silver:#8AB8FF;
  --border:rgba(255,255,255,.09);
}
body{
  font-family:'Tajawal',sans-serif;background:var(--bg);color:#fff;min-height:100vh;
  background-image:radial-gradient(ellipse 120% 50% at 50% -5%,rgba(10,50,200,.4),transparent 65%);
  padding-top:max(env(safe-area-inset-top), 22px);padding-bottom:max(env(safe-area-inset-bottom), 10px);
  padding-left:max(env(safe-area-inset-left), 10px);padding-right:max(env(safe-area-inset-right), 10px);
}
html.is-android body{padding-top:max(env(safe-area-inset-top), 44px);}
.wrap{max-width:720px;margin:0 auto;padding:1rem}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.hdr h1{font-family:'Cairo',sans-serif;font-size:1.3rem;color:var(--gold)}
.btn{border:none;border-radius:12px;padding:.7rem 1.3rem;font-weight:800;font-size:.95rem;cursor:pointer;font-family:'Tajawal',sans-serif}
.btn-cyan{background:var(--cyan);color:#031318}
.btn-gold{background:var(--gold);color:#2b1c00}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:var(--card);color:#fff;border:1px solid var(--border)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:1.1rem;margin-bottom:1rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap}
input[type=text],input[type=number]{
  background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:10px;color:#fff;
  padding:.7rem .9rem;font-size:1rem;font-family:'Tajawal',sans-serif;flex:1;min-width:140px
}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem;margin:1rem auto;max-width:min(320px,80vw)}
.cell{
  aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-family:'Cairo',sans-serif;font-weight:900;font-size:clamp(.8rem,3.4vw,1.05rem);cursor:pointer;
  background:rgba(0,229,255,.07);border:1.5px solid rgba(0,229,255,.17);transition:.15s;user-select:none;
}
.cell:hover{background:rgba(0,229,255,.17);border-color:var(--cyan);transform:scale(1.06)}
.cell.used-win{background:rgba(0,230,118,.15);border-color:var(--green);color:var(--green);cursor:not-allowed;transform:none}
.cell.used-lose{background:rgba(255,61,90,.12);border-color:var(--red);color:var(--red);cursor:not-allowed;transform:none}
.cell.used-mabrook{background:rgba(255,208,70,.18);border-color:var(--gold);color:var(--gold);cursor:not-allowed;transform:none}
.cell.picked{outline:2px solid var(--gold)}
.opts{display:flex;flex-direction:column;gap:.6rem;margin-top:1rem}
.opt{
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.9rem 1rem;
  display:flex;align-items:center;gap:.7rem;cursor:pointer;font-size:1.02rem
}
.opt .lbl{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.85rem;flex-shrink:0}
.opt.correct{background:rgba(0,230,118,.2);border-color:var(--green)}
.opt.wrong{background:rgba(255,61,90,.2);border-color:var(--red)}
.opt.disabled{pointer-events:none;opacity:.55}
.qtext{font-size:1.15rem;font-weight:700;line-height:1.6;margin-bottom:.3rem}
.timerBar{width:100%;height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-bottom:.7rem}
.timerBarFill{height:100%;background:var(--cyan);width:100%;transition:width 1s linear,background .3s}
.timerBarFill.warn{background:var(--gold)}
.timerBarFill.danger{background:var(--red)}
.qcat{color:var(--cyan);font-size:.8rem;margin-bottom:.6rem}
.pill{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:99px;
  padding:.25rem .8rem;font-size:.8rem;color:var(--gold)}
.winlist{display:flex;flex-direction:column;gap:.4rem;max-height:280px;overflow:auto}
.winrow{display:flex;justify-content:space-between;align-items:center;background:var(--card);
  border:1px solid var(--border);border-radius:10px;padding:.6rem .9rem}
.dim{color:rgba(255,255,255,.5);font-size:.85rem}
.center{text-align:center}
.drawResult{
  font-family:'Cairo',sans-serif;font-size:2rem;font-weight:900;color:var(--gold);
  text-align:center;padding:1.5rem 0
}
a.back{color:var(--cyan);text-decoration:none;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>🎙️ وضع فردي</h1>
    <a class="back" href="index.html">← الرئيسية</a>
  </div>

  <!-- ═══ إعداد الفعالية (قبل البدء) ═══ -->
  <div class="card" id="setupCard">
    <div class="dim" style="margin-bottom:.8rem">
      كل متصل يختار رقمًا، يجاوب على السؤال — صح يدخل السحب، غلط يخرج. جولات متعددة، سحب تراكمي بالنهاية.
    </div>
    <div class="row" style="margin-bottom:.7rem">
      <input type="text" id="eventName" placeholder="اسم الفعالية (اختياري)">
    </div>
    <button class="btn btn-cyan" onclick="startEvent()" style="width:100%">🚀 ابدأ الفعالية</button>
  </div>

  <!-- ═══ شاشة الجولة الجارية ═══ -->
  <div id="roundCard" style="display:none">
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:.6rem">
        <span class="pill" id="roundPill">جولة 1</span>
        <span class="dim" id="remainPill">20 رقم متبقي</span>
      </div>
      <div class="board" id="board"></div>
      <div class="row" style="margin-top:.5rem">
        <button class="btn btn-ghost" onclick="endRoundNow()" style="flex:1">⏹️ إنهاء الجولة الآن</button>
        <button class="btn btn-gold" onclick="newRound()" style="flex:1">➕ جولة جديدة</button>
      </div>
    </div>

    <!-- إدخال اسم المتسابق قبل عرض سؤاله -->
    <div class="card" id="nameCard" style="display:none;position:fixed;top:max(env(safe-area-inset-top), 20px);left:.7rem;right:.7rem;z-index:999;box-shadow:0 8px 30px rgba(0,0,0,.6);max-width:720px;margin:0 auto;background:#10152F;border:1px solid rgba(255,255,255,.18)">
      <div class="dim" style="margin-bottom:.6rem">الرقم <b id="pickedNumLbl" style="color:var(--gold)"></b> — اسم المتسابق:</div>
      <div class="row">
        <input type="text" id="callerName" placeholder="اسم المتسابق">
        <button class="btn btn-cyan" onclick="confirmCaller()">عرض السؤال</button>
      </div>
      <div style="text-align:center;margin-top:.5rem"><a href="#" onclick="return closeNameCard()" class="dim" style="text-decoration:none;font-size:.82rem">✕ إلغاء</a></div>
    </div>

    <!-- السؤال -->
    <div class="card" id="qCard" style="display:none">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:.4rem">
        <div class="qcat" id="qCat" style="margin-bottom:0"></div>
        <div id="timerBox" style="font-family:'Cairo',sans-serif;font-weight:900;font-size:1.1rem;color:var(--cyan)">⏱️ <span id="timerNum">30</span></div>
      </div>
      <div class="timerBar"><div class="timerBarFill" id="timerBarFill"></div></div>
      <div class="qtext" id="qText"></div>
      <div class="opts" id="qOpts"></div>
    </div>


    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:.5rem">
        <b>🏆 قائمة السحب (<span id="winCount">0</span>)</b>
      </div>
      <div class="winlist" id="winList"><div class="dim center">ولا أحد بعد</div></div>
    </div>

    <button class="btn btn-gold" onclick="openDraw()" style="width:100%" id="drawBtn" disabled>🎉 اسحب الفائزين</button>
  </div>

  <!-- ═══ نافذة السحب ═══ -->
  <div class="card" id="drawCard" style="display:none">
    <div class="row" style="margin-bottom:.8rem">
      <input type="number" id="drawCount" value="1" min="1" style="max-width:100px">
      <button class="btn btn-cyan" onclick="doDraw()" style="flex:1">🎲 اسحب الآن</button>
      <button class="btn btn-ghost" onclick="closeDraw()">إغلاق</button>
    </div>
    <div id="drawOut"></div>
  </div>
</div>

<script src="js/question-bank.js"></script>
<script src="js/capacitor-bridge.js"></script>
<script>
"use strict";

var STORE_KEY = "tahadi_audience_v1";
var TOTAL_CELLS = 20;

var S = {
  eventName: "",
  round: 1,
  used: {},        // {cellIndex: {name, result:'win'|'lose'}}
  winners: [],      // [{name, round, cell}]
  pickedCell: null,
  currentQ: null
};

// لا حفظ بأي تخزين دائم عمداً — الفعالية جلسة حية، تُمسح تلقائياً عند إغلاق
// التطبيق/إعادة تحميل الصفحة (لا نبي بيانات فعالية سابقة تختلط بفعالية جديدة).
function save(){ /* no-op بالتصميم */ }

function pickRandomMabrookCell(){
  return Math.floor(Math.random()*TOTAL_CELLS);
}

function startEvent(){
  S.eventName = document.getElementById("eventName").value.trim();
  S.round = 1; S.used = {}; S.winners = []; S.pickedCell = null; S.currentQ = null;
  S.mabrookCell = pickRandomMabrookCell();
  document.getElementById("setupCard").style.display = "none";
  document.getElementById("roundCard").style.display = "block";
  renderAll();
}

function renderBoard(){
  var b = document.getElementById("board");
  b.innerHTML = "";
  var usedCount = 0;
  for(var i=0;i<TOTAL_CELLS;i++){
    var st = S.used[i];
    var cls = "cell";
    if(st){
      cls += st.result==="mabrook" ? " used-mabrook" : (st.result==="win" ? " used-win" : " used-lose");
      usedCount++;
    }
    if(S.pickedCell===i) cls += " picked";
    var div = document.createElement("div");
    div.className = cls;
    div.textContent = i+1;
    if(!st && S.pickedCell===null){
      div.onclick = function(idx){ return function(){ pickCell(idx); }; }(i);
    }
    b.appendChild(div);
  }
  document.getElementById("remainPill").textContent = (TOTAL_CELLS-usedCount)+" رقم متبقٍ";
  document.getElementById("roundPill").textContent = "جولة "+S.round;
}

function pickCell(i){
  if(S.used[i] || S.pickedCell!==null) return;
  S.pickedCell = i;
  save();
  renderBoard();
  document.getElementById("pickedNumLbl").textContent = (i+1);
  document.getElementById("callerName").value = "";
  document.getElementById("nameCard").style.display = "block";
  document.getElementById("qCard").style.display = "none";
  document.getElementById("callerName").focus();
}

function closeNameCard(){
  document.getElementById("callerName").blur();
  document.getElementById("nameCard").style.display = "none";
  S.pickedCell = null;
  save();
  renderBoard();
  return false;
}

function pickRandomQuestion(){
  if(!window.QB || !QB.length) return null;
  return QB[Math.floor(Math.random()*QB.length)];
}

function confirmCaller(){
  var name = document.getElementById("callerName").value.trim();
  if(!name){ alert("اكتب اسم المتسابق أول"); return; }
  document.getElementById("nameCard").style.display = "none";
  // خلية "مبروك" — فوز فوري بدون سؤال
  if(S.pickedCell === S.mabrookCell){
    S.used[S.pickedCell] = { name: name, result: "mabrook" };
    S.winners.push({ name: name, round: S.round, cell: S.pickedCell });
    S.pickedCell = null;
    save();
    showMabrookCelebration(name);
    return;
  }
  S.currentQ = { q: pickRandomQuestion(), name: name };
  save();
  renderQuestion();
  document.getElementById("qCard").style.display = "block";
}

function showMabrookCelebration(name){
  stopQuestionTimer();
  document.getElementById("timerBox").style.display = "none";
  document.getElementById("timerBarFill").parentElement.style.display = "none";
  var q = document.getElementById("qCard");
  q.style.display = "block";
  document.getElementById("qCat").textContent = "";
  document.getElementById("qText").innerHTML = '<div style="text-align:center;padding:1rem 0">'
    +'<div style="font-size:2.2rem;margin-bottom:.5rem">🎊</div>'
    +'<div style="font-family:\'Cairo\',sans-serif;font-size:1.6rem;font-weight:900;color:var(--gold)">مبروك يا '+name+'!</div>'
    +'<div class="dim" style="margin-top:.4rem">دخلت قائمة السحب مباشرة بدون سؤال</div>'
    +'</div>';
  document.getElementById("qOpts").innerHTML = "";
  setTimeout(function(){
    document.getElementById("qCard").style.display = "none";
    renderBoard();
    renderWinners();
  }, 2200);
}

var QUESTION_SECONDS = 30;
var _qTimer = null, _qTimeLeft = QUESTION_SECONDS;

function renderQuestion(){
  var q = S.currentQ.q;
  document.getElementById("timerBox").style.display = "";
  document.getElementById("timerBarFill").parentElement.style.display = "";
  document.getElementById("qCat").textContent = q.cat || "";
  document.getElementById("qText").textContent = q.text;
  var opts = document.getElementById("qOpts");
  opts.innerHTML = "";
  ["A","B","C","D"].forEach(function(k){
    var div = document.createElement("div");
    div.className = "opt";
    div.innerHTML = '<span class="lbl">'+k+'</span><span>'+q[k]+'</span>';
    div.onclick = function(){ answerPicked(k); };
    div.id = "opt-"+k;
    opts.appendChild(div);
  });
  startQuestionTimer();
}

function startQuestionTimer(){
  stopQuestionTimer();
  _qTimeLeft = QUESTION_SECONDS;
  updateTimerUI();
  _qTimer = setInterval(function(){
    _qTimeLeft--;
    updateTimerUI();
    if(_qTimeLeft<=0){
      stopQuestionTimer();
      answerPicked(null); // انتهى الوقت — يُعامل كإجابة خاطئة
    }
  }, 1000);
}
function stopQuestionTimer(){
  if(_qTimer){ clearInterval(_qTimer); _qTimer = null; }
}
function updateTimerUI(){
  var numEl = document.getElementById("timerNum");
  var fillEl = document.getElementById("timerBarFill");
  if(!numEl||!fillEl) return;
  numEl.textContent = _qTimeLeft;
  fillEl.style.width = Math.max(0,(_qTimeLeft/QUESTION_SECONDS*100))+"%";
  fillEl.className = "timerBarFill" + (_qTimeLeft<=10 ? " danger" : _qTimeLeft<=20 ? " warn" : "");
}

function answerPicked(choice){
  stopQuestionTimer();
  var q = S.currentQ.q, name = S.currentQ.name, cell = S.pickedCell;
  var correct = (choice !== null && choice === q.correct);
  ["A","B","C","D"].forEach(function(k){
    var el = document.getElementById("opt-"+k);
    el.classList.add("disabled");
    if(k===q.correct) el.classList.add("correct");
    else if(k===choice && !correct) el.classList.add("wrong");
  });
  S.used[cell] = { name: name, result: correct ? "win" : "lose" };
  if(correct){ S.winners.push({ name: name, round: S.round, cell: cell }); }
  S.pickedCell = null;
  save();
  setTimeout(function(){
    document.getElementById("qCard").style.display = "none";
    renderBoard();
    renderWinners();
  }, 1400);
}

function renderWinners(){
  var list = document.getElementById("winList");
  document.getElementById("winCount").textContent = S.winners.length;
  document.getElementById("drawBtn").disabled = S.winners.length===0;
  if(!S.winners.length){ list.innerHTML = '<div class="dim center">ولا أحد بعد</div>'; return; }
  list.innerHTML = "";
  S.winners.slice().reverse().forEach(function(w){
    var row = document.createElement("div");
    row.className = "winrow";
    row.innerHTML = '<span>'+w.name+' <span class="dim" style="font-size:.8em">(رقم '+(w.cell+1)+')</span></span><span class="dim">جولة '+w.round+'</span>';
    list.appendChild(row);
  });
}

function endRoundNow(){
  if(!confirm("إنهاء الجولة الحالية؟ الفائزون بها يبقون بالسحب.")) return;
  stopQuestionTimer();
  S.pickedCell = null; S.currentQ = null;
  document.getElementById("qCard").style.display = "none";
  document.getElementById("nameCard").style.display = "none";
  save();
}

function newRound(){
  if(!confirm("بدء جولة جديدة؟ اللوحة ترجع فاضية، الفائزون السابقون يبقون بالسحب.")) return;
  S.round++; S.used = {}; S.pickedCell = null; S.currentQ = null;
  S.mabrookCell = pickRandomMabrookCell();
  save();
  renderAll();
}

function openDraw(){
  document.getElementById("drawCard").style.display = "block";
  document.getElementById("drawOut").innerHTML = "";
  document.getElementById("drawCard").scrollIntoView({behavior:"smooth"});
}
function closeDraw(){
  document.getElementById("drawCard").style.display = "none";
}
function doDraw(){
  var n = Math.max(1, parseInt(document.getElementById("drawCount").value,10)||1);
  var pool = S.winners.slice();
  if(!pool.length){ document.getElementById("drawOut").innerHTML = '<div class="dim center">ولا أحد بقائمة السحب</div>'; return; }
  var picks = [];
  for(var i=0;i<n && pool.length;i++){
    var idx = Math.floor(Math.random()*pool.length);
    picks.push(pool.splice(idx,1)[0]);
  }
  var out = document.getElementById("drawOut");
  out.innerHTML = "";
  picks.forEach(function(p,i){
    var div = document.createElement("div");
    div.className = "drawResult";
    div.innerHTML = "🏆 "+p.name+'<div style="font-size:1rem;color:var(--dim);font-weight:700;margin-top:.2rem">رقم '+(p.cell+1)+' — جولة '+p.round+'</div>';
    out.appendChild(div);
  });
  // احذف الفائزين المسحوبين نهائياً من القائمة — ما ينسحبون مرة ثانية بنفس الفعالية
  S.winners = S.winners.filter(function(w){
    return !picks.some(function(p){ return p===w; });
  });
  renderWinners();
}

function renderAll(){
  renderBoard();
  renderWinners();
  document.getElementById("nameCard").style.display = "none";
  document.getElementById("qCard").style.display = "none";
}

// لا حاجة لاستعادة أي حالة سابقة — الفعالية تبدأ دايماً من شاشة الإعداد
// (حقل اسم المتسابق مثبَّت بأعلى الشاشة دائماً الآن — فوق أي احتمال تغطية
// من لوحة المفاتيح، بغض النظر عن سلوك المنصة أو أي توقيت تحميل)
</script>
</body>
</html>
